<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#c65f3a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="商务英语">
    <meta name="description" content="70 天商务英语听、写、背、说学习计划">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png">
    <link rel="stylesheet" href="./css/styles.css">
    <title>商务英语 70 天</title>
  </head>
  <body>
    <div class="app-frame">
      <header class="site-header">
        <a class="brand" href="#/today" aria-label="商务英语 70 天首页">
          <span class="brand__mark" aria-hidden="true">70</span>
          <span><strong>商务英语</strong><small>Daily field notes</small></span>
        </a>
        <span class="header-rule" aria-hidden="true"></span>
        <a id="settings-link" class="header-settings" href="#/settings" data-route="settings" aria-label="设置" hidden>
          <span aria-hidden="true">⚙</span>
          <span>设置</span>
        </a>
      </header>

      <p id="storage-warning" class="storage-warning" role="alert" hidden>
        当前浏览器无法保存进度。本次使用期间仍可继续学习，关闭或刷新页面后记录可能丢失。
      </p>

      <main id="app" tabindex="-1"></main>

      <nav id="primary-nav" class="primary-nav" aria-label="主要导航">
        <a href="#/today" data-route="today"><span aria-hidden="true">⌂</span>今日</a>
        <a href="#/courses" data-route="courses"><span aria-hidden="true">▤</span>课程</a>
        <a href="#/progress" data-route="progress"><span aria-hidden="true">◌</span>进度</a>
      </nav>
    </div>
    <p id="app-status" class="visually-hidden" aria-live="polite" aria-atomic="true"></p>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
